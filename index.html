<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>J Nat Coffee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F8F5F0;
    --paper:#FFFFFF;
    --ink:#1C1917;
    --brown:#292524;
    --clay:#78716C;
    --clay-soft:#A8A29E;
    --line:#E7E5E4;
    --green:#40534C;
    --cover:#1C1917;
    --cover-light:#292524;
    --gold:#D4AF37;
    --danger:#991B1B;
    --surface:#F5F1EA;
    --home-bg:#E8DDCA;
  }

  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}

  html,body{
    height:100%;
    background:var(--cream);
    font-family:'Outfit', Helvetica, Arial, sans-serif;
    color:var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  h1,h2,h3,.amharic{
    font-family:'Cormorant Garamond','Noto Serif Ethiopic', serif;
    font-weight:500;
  }

  button{ font-family:inherit; border:none; background:none; cursor:pointer; }
  input{ font-family:inherit; }

  .screen{
    position:relative;
    width:100%; height:100%;
    background:var(--cream);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition: background 0.3s ease;
  }
  .screen.home-mode {
    background: var(--home-bg);
  }

  /* ===== App header ===== */
  .app-header{
    padding:6px 20px 14px;
    flex-shrink:0;
    background:var(--cream);
    z-index:20;
    transition: background 0.3s ease;
  }
  .screen.home-mode .app-header{
    background: var(--home-bg);
  }
  .app-header .brand-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand-mark{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-mark .glyph{
    width:38px; height:38px;
    border-radius:50%;
    background:var(--gold);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark .glyph svg{ width:20px; height:20px; stroke:#fff; fill:none; stroke-width:1.8; }
  .brand-mark .name{ font-size:1.3rem; color:var(--ink); line-height:1.1; font-family:'Cormorant Garamond', serif; font-weight:600; letter-spacing:0.02em; }
  .brand-mark .name .am{ font-size:0.8rem; color:var(--clay); display:block; margin-top:2px; font-weight:400; font-family:'Georgia', serif; }

  .icon-btn{
    width:36px; height:36px;
    border-radius:50%;
    background:var(--paper);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition:transform 0.15s ease, background 0.2s ease;
  }
  .icon-btn:active{ transform:scale(0.9); }
  .icon-btn svg{ width:17px; height:17px; stroke:var(--brown); fill:none; stroke-width:1.7; }
  .icon-btn .badge{
    position:absolute;
    top:-4px; right:-4px;
    min-width:16px; height:16px;
    padding:0 3px;
    border-radius:999px;
    background:var(--clay);
    color:#fff;
    font-size:0.62rem;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
  }

  .page-title{ margin-top:16px; }
  .page-title h1{ font-size:1.6rem; color:var(--ink); }
  .page-title .sub{ font-size:0.82rem; color:var(--clay); margin-top:3px; }

  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:0.68rem;
    letter-spacing:0.03em;
    color:var(--green);
    background:rgba(92,107,79,0.1);
    border-radius:999px;
    padding:4px 10px 4px 8px;
    margin-top:10px;
  }
  .status-pill .dot{ width:6px; height:6px; border-radius:50%; background:var(--green); }
  .status-pill.closed{ color:var(--danger); background:rgba(168,91,74,0.1); }
  .status-pill.closed .dot{ background:var(--danger); }

  /* search */
  .search-bar{
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:10px 14px;
  }
  .search-bar svg{ width:16px; height:16px; stroke:var(--clay); fill:none; stroke-width:1.8; flex-shrink:0; }
  .search-bar input{
    border:none; outline:none; background:none;
    font-size:0.88rem; color:var(--ink); flex:1;
  }
  .search-bar input::placeholder{ color:#B7A88C; }

  /* ===== Scroll view ===== */
  .view{
    flex:1;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    padding:4px 20px 100px;
    scroll-behavior:smooth;
  }
  .view::-webkit-scrollbar{ display:none; }

  .view.enter{ animation:viewIn 0.32s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes viewIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .section-label{
    font-size:0.72rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--clay);
    margin:22px 0 10px;
  }
  .section-label:first-child{ margin-top:4px; }

  /* chip rail */
  .chip-rail{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:2px;
    margin:0 -20px;
    padding-left:20px;
    padding-right:20px;
  }
  .chip-rail::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0;
    font-size:0.78rem;
    color:var(--brown);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:999px;
    padding:8px 15px;
    transition:all 0.18s ease, transform 0.12s ease;
    white-space:nowrap;
  }
  .chip:active{ transform:scale(0.95); }
  .chip.active{ background:var(--clay); border-color:var(--clay); color:#fff; }

  /* pick cards (home) */
  .pick-rail{
    display:flex;
    gap:12px;
    overflow-x:auto;
    margin:0 -20px;
    padding:2px 20px 8px;
  }
  .pick-rail::-webkit-scrollbar{ display:none; }
  .pick-card{
    flex-shrink:0;
    width:148px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
    display:flex; flex-direction:column;
    transition:transform 0.15s ease;
  }
  .pick-card:active{ transform:scale(0.97); }
  .pick-card .icon-wrap{
    width:100%; height:64px;
    border-radius:12px;
    background:linear-gradient(150deg, var(--cover), var(--cover-light));
    display:flex; align-items:center; justify-content:center;
    margin-bottom:10px;
    position:relative;
  }
  .pick-card .icon-wrap svg{ width:26px; height:26px; stroke:var(--gold); fill:none; stroke-width:1.5; }
  .pick-card .heart-btn{
    position:absolute; top:6px; right:6px;
    width:24px; height:24px;
    border-radius:50%;
    background:rgba(255,255,255,0.85);
    display:flex; align-items:center; justify-content:center;
  }
  .pick-card .heart-btn svg{ width:12px; height:12px; stroke:var(--clay); fill:none; stroke-width:2; }
  .pick-card .heart-btn.active svg{ fill:var(--clay); }
  .pick-card .en{ font-size:0.86rem; color:var(--ink); line-height:1.25; }
  .pick-card .am{ font-size:0.72rem; color:var(--clay); margin-top:2px; font-family:'Georgia','Noto Serif Ethiopic',serif; }
  .pick-card .row{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .pick-card .price{ font-size:0.8rem; font-weight:700; color:var(--brown); }
  .pick-card .price::before{ content:"ETB "; font-size:0.6rem; font-weight:400; color:var(--clay); }

  .add-btn{
    width:26px; height:26px;
    border-radius:50%;
    background:var(--cover);
    color:var(--gold);
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.15s ease;
  }
  .add-btn:active{ transform:scale(0.85); }
  .add-btn svg{ width:13px; height:13px; stroke:var(--gold); stroke-width:2.2; }

  /* item list rows */
  .item-row{
    display:flex;
    align-items:center;
    gap:16px;
    padding:18px 0;
    border-bottom:1px solid var(--line);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .item-row:active{ transform: scale(0.98); }
  .item-row .thumb{
    width:52px; height:52px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid rgba(212,175,55,0.2);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .item-row .thumb svg{ width:22px; height:22px; stroke:var(--gold); fill:none; stroke-width:1.6; }
  .item-row .info{ flex:1; min-width:0; }
  .item-row .info .en{ font-size:1.15rem; color:var(--ink); font-family:'Cormorant Garamond', serif; font-weight:600; }
  .item-row .info .am{ font-size:0.8rem; color:var(--clay); margin-top:2px; font-family:'Georgia','Noto Serif Ethiopic',serif; }
  .item-row .info .price{ font-size:0.95rem; color:var(--gold); font-weight:500; margin-top:4px; font-family:'Outfit', sans-serif; }
  .item-row .info .price::before{ content:"ETB "; font-size:0.7rem; font-weight:400; color:var(--clay); }
  .item-row .actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .item-row .fav-btn svg{ width:16px; height:16px; stroke:var(--clay); fill:none; stroke-width:1.8; }
  .item-row .fav-btn.active svg{ fill:var(--clay); }

  .qty-stepper{
    display:flex; align-items:center; gap:8px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px 6px;
  }
  .qty-stepper button{
    width:20px; height:20px;
    border-radius:50%;
    background:var(--cream);
    display:flex; align-items:center; justify-content:center;
  }
  .qty-stepper button svg{ width:9px; height:9px; stroke:var(--brown); stroke-width:2.4; }
  .qty-stepper .qty-num{ font-size:0.8rem; font-weight:700; min-width:14px; text-align:center; }

  .subhead{
    font-size:0.75rem;
    color:var(--green);
    letter-spacing:0.03em;
    margin:16px 0 4px;
  }

  .blurb{ color:var(--brown); font-size:0.85rem; line-height:1.5; margin-top:12px; }

  /* empty state */
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--clay);
  }
  .empty-state .glyph{
    width:52px; height:52px;
    border-radius:50%;
    background:var(--paper);
    border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 14px;
  }
  .empty-state .glyph svg{ width:22px; height:22px; stroke:var(--clay); fill:none; stroke-width:1.6; }
  .empty-state .title{ font-size:0.95rem; color:var(--ink); margin-bottom:4px; }
  .empty-state .sub{ font-size:0.8rem; color:var(--clay); }
  .empty-state .cta{
    margin-top:16px;
    display:inline-block;
    font-size:0.78rem;
    color:#fff;
    background:var(--clay);
    padding:9px 18px;
    border-radius:999px;
  }

  /* cart */
  .order-note{
    margin-top:14px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
  }
  .order-note label{ font-size:0.72rem; letter-spacing:0.05em; color:var(--clay); text-transform:uppercase; }
  .order-note input{
    width:100%;
    border:none; background:none; outline:none;
    font-size:0.88rem; color:var(--ink);
    margin-top:6px;
  }
  .order-note input::placeholder{ color:#B7A88C; }

  .summary{
    margin-top:18px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
  }
  .summary .row{ display:flex; justify-content:space-between; font-size:0.85rem; color:var(--brown); padding:5px 0; }
  .summary .row.total{ font-weight:700; color:var(--ink); font-size:0.98rem; border-top:1px dotted var(--line); margin-top:6px; padding-top:12px; }
  .summary .row .val::before{ content:"ETB "; font-size:0.62rem; font-weight:400; color:var(--clay); }

  .place-order-btn{
    width:100%;
    margin-top:16px;
    background:var(--cover);
    color:var(--cream);
    font-size:0.9rem;
    letter-spacing:0.02em;
    padding:15px;
    border-radius:14px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    transition:transform 0.15s ease;
  }
  .place-order-btn:active{ transform:scale(0.98); }
  .place-order-btn svg{ width:15px; height:15px; stroke:var(--gold); fill:none; stroke-width:1.8; }

  .pay-note{
    margin-top:14px;
    font-size:0.75rem;
    color:var(--clay);
    text-align:center;
    line-height:1.6;
  }

  /* welcome card */
  .welcome-card {
    margin: 10px 20px 30px;
    border-radius: 20px;
    overflow: hidden;
    background: var(--paper);
    border: none;
    box-shadow: 0 16px 40px rgba(0,0,0,0.06);
  }
  .welcome-card .jazz-img {
    width: 100%;
    height: 240px;
    object-fit: cover;
    display: block;
  }
  .welcome-card .welcome-text {
    padding: 24px 20px;
    text-align: center;
  }
  .welcome-card .welcome-text h3 {
    font-size: 1.8rem;
    color: var(--ink);
    margin-bottom: 8px;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
  }
  .welcome-card .welcome-text p {
    font-size: 0.95rem;
    color: var(--clay);
    line-height: 1.6;
    font-family: 'Outfit', sans-serif;
    font-weight: 300;
  }

  /* ===== Bottom tab bar ===== */
  .tabbar{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:12px 20px;
    background:rgba(255, 255, 255, 0.85);
    backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.6);
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
    position:absolute;
    bottom:calc(20px + env(safe-area-inset-bottom, 0px));
    left:20px; right:20px;
    border-radius:999px;
    z-index:100;
  }
  .tab-btn{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:#B7A88C;
    font-size:0.62rem;
    letter-spacing:0.02em;
    padding:4px 14px;
    position:relative;
    transition:color 0.2s ease, transform 0.15s ease;
  }
  .tab-btn:active{ transform:scale(0.92); }
  .tab-btn svg{ width:26px; height:26px; stroke:currentColor; fill:none; stroke-width:2.2; margin-bottom:3px; }
  .tab-btn.active{ color:var(--brown); }
  .tab-btn.active svg{ stroke-width:2.4; }
  .tab-btn .badge{
    position:absolute; top:-2px; right:6px;
    min-width:15px; height:15px; padding:0 3px;
    border-radius:999px;
    background:var(--clay);
    color:#fff;
    font-size:0.58rem; font-weight:700;
    display:flex; align-items:center; justify-content:center;
  }

  /* toast */
  .toast{
    position:absolute;
    left:20px; right:20px;
    bottom:96px;
    background:var(--cover);
    color:var(--cream);
    font-size:0.82rem;
    padding:13px 16px;
    border-radius:14px;
    display:flex; align-items:center; gap:10px;
    box-shadow:0 12px 30px rgba(0,0,0,0.35);
    z-index:300;
    opacity:0;
    pointer-events:none;
    transform:translateY(10px);
    transition:opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show{ opacity:1; transform:translateY(0); }
  .toast svg{ width:15px; height:15px; stroke:var(--gold); fill:none; stroke-width:1.8; flex-shrink:0; }

  /* search results overlay */
  .search-results{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    background:var(--cream);
    z-index:250;
    display:flex;
    flex-direction:column;
    transform:translateY(100%);
    transition:transform 0.3s cubic-bezier(.2,.7,.2,1);
  }
  .search-results.open{ transform:translateY(0); }

  /* order confirmation */
  .confirm-wrap{
    text-align:center;
    padding:30px 10px 10px;
  }
  .confirm-wrap .glyph{
    width:64px; height:64px;
    border-radius:50%;
    background:var(--green);
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 18px;
    animation:popIn 0.4s cubic-bezier(.2,.9,.3,1.3) both;
  }
  @keyframes popIn{ from{ transform:scale(0.5); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .confirm-wrap .glyph svg{ width:28px; height:28px; stroke:#fff; fill:none; stroke-width:2; }
  .confirm-wrap h2{ font-size:1.25rem; color:var(--ink); }
  .confirm-wrap p{ font-size:0.85rem; color:var(--clay); margin-top:6px; }

  .payment-card{
    background:var(--paper);
    border-radius:16px;
    padding:20px;
    box-shadow:0 8px 24px rgba(0,0,0,0.04);
    border:1px solid rgba(212,175,55,0.25);
    margin:14px 20px;
  }
  .payment-card .row{ display:flex; justify-content:space-between; font-size:0.95rem; color:var(--brown); padding:10px 0; border-bottom:1px solid var(--line); }
  .payment-card .row:last-child{ border-bottom:none; padding-bottom:0; }
  .payment-card .row:first-child{ padding-top:0; }
  .payment-card .row span:first-child{ color:var(--clay); }

  .back-home-btn{
    margin-top:22px;
    width:100%;
    background:var(--clay);
    color:#fff;
    font-size:0.86rem;
    padding:13px;
    border-radius:14px;
  }

  /* about footer on home */
  .made-by{
    margin-top:30px;
    text-align:center;
    font-size:0.7rem;
    color:#B7A88C;
    padding-bottom:6px;
  }
  .made-by a{ color:var(--clay); text-decoration:none; border-bottom:1px solid var(--clay-soft); }

  /* Mobile viewport safe area padding for app header if needed */
  .app-header {
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>

<div class="screen">

      <div id="header" class="app-header"></div>

      <div id="view" class="view"></div>

      <div class="tabbar" id="tabbar"></div>

      <div class="toast" id="toast"></div>

      <div class="search-results" id="searchOverlay"></div>

    </div>

<script>
/* ================= Icons ================= */
const ICON = {
  home:'<path d="M4 11 L12 4 L20 11"/><path d="M6 10 L6 20 L18 20 L18 10"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/>',
  heart:'<path d="M12 20 C6 15.6 3 12.4 3 8.8 C3 6 5.2 4 7.8 4 C9.6 4 11 5 12 6.4 C13 5 14.4 4 16.2 4 C18.8 4 21 6 21 8.8 C21 12.4 18 15.6 12 20 Z"/>',
  cart:'<circle cx="9" cy="20" r="1.4" fill="currentColor" stroke="none"/><circle cx="17" cy="20" r="1.4" fill="currentColor" stroke="none"/><path d="M2.5 3.5 H5 L7.4 15 H18.2 L20.5 6.5 H6.2"/>',
  search:'<circle cx="10" cy="10" r="6.5"/><path d="M19 19 L14.8 14.8"/>',
  bell:'<path d="M6 10 C6 5.6 8.7 3 12 3 C15.3 3 18 5.6 18 10 C18 15 20 16.5 20 16.5 H4 C4 16.5 6 15 6 10 Z"/><path d="M9.5 19 A2.5 2.5 0 0 0 14.5 19"/>',
  plus:'<path d="M10 3 V17 M3 10 H17"/>',
  minus:'<path d="M3 10 H17"/>',
  cup:'<path d="M5 8 H16 L15 18 A2 2 0 0 1 13 20 H8 A2 2 0 0 1 6 18 Z"/><path d="M16 9 H19 A2 2 0 0 1 19 14 H16"/><path d="M8 3 C7 4.5 9 5 8.3 6.5"/><path d="M12 3 C11 4.5 13 5 12.3 6.5"/>',
  bag:'<path d="M6 8 H18 L17 20 H7 Z"/><path d="M9 8 V6 A3 3 0 0 1 15 6 V8"/>',
  bowl:'<path d="M4 10 H20 A8 6 0 0 1 4 10 Z"/><path d="M4 10 C4 14 7.5 17 12 17 C16.5 17 20 14 20 10"/>',
  pizza:'<path d="M12 3 L21 19 H3 Z"/><circle cx="12" cy="10" r="1" fill="currentColor" stroke="none"/><circle cx="9.5" cy="14" r="1" fill="currentColor" stroke="none"/><circle cx="14.5" cy="14.5" r="1" fill="currentColor" stroke="none"/>',

/* flatten every item into one lookup with a stable id and its category icon */
const ITEMS = [];
CATEGORIES.forEach(cat=>{
  const push = (en,am,price)=>{
    const id = cat.id + '_' + en.toLowerCase().replace(/[^a-z0-9]+/g,'_');
    ITEMS.push({ id, en, am, price, catId:cat.id, catEn:cat.en, ic:cat.ic });
  };
  if(cat.items) cat.items.forEach(([en,am,price])=>push(en,am,price));
  if(cat.groups) cat.groups.forEach(g=>g.items.forEach(([en,am,price])=>push(en,am,price)));
});
function findItem(id){ return ITEMS.find(i=>i.id===id); }

/* ================= State ================= */
const state = {
  tab:'home',
  menuCat:'breakfast',
  searchOpen:false,
  query:''
};

let toastTimer=null;
function showToast(ic,msg){
  const t = document.getElementById('toast');
  t.innerHTML = `${svg(ic,15)}<span>${msg}</span>`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ================= Small render helpers ================= */
function svg(name,size=18){
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}">${icon(name)}</svg>`;
}
function getItemImage(it) {
  const name = it.en.toLowerCase();
  const cat = it.catId;

  if (cat === 'burgers') {
    if (name.includes('wrap')) return 'img/wrap.jpg';
    return 'img/burger.jpg';
  }
  if (cat === 'pizza') return 'img/pizza.jpg';
  
  if (name.includes('sandwich')) return 'img/sandwich.jpg';
  if (name.includes('french fries') || name.includes('chips')) return 'img/fries.jpg';
  
  if (name.includes('iced') || name.includes('cold')) return 'img/iced_coffee.jpg';

  return null;
}

function itemRow(it){
  const img = getItemImage(it);
  const thumbContent = img ? `<img src="${img}" style="width:100%; height:100%; object-fit:cover; border-radius:50%;">` : svg(it.ic,20);
  return `<div class="item-row">
    <div class="thumb" style="${img ? 'border:none; background:none; overflow:hidden;' : ''}">${thumbContent}</div>
    <div class="info">
      <div class="en">${it.en}</div>
      <div class="am">${it.am}</div>
      <div class="price">${it.price}</div>
    </div>
  </div>`;
}

function openCategory(catId){
  state.tab='menu';
  state.menuCat=catId;
  renderAll();
}

/* ================= Header ================= */
function greeting(){
  const h = new Date().getHours();
  if(h<11) return 'Good morning';
  if(h<17) return 'Good afternoon';
  return 'Good evening';
}
function isOpenNow(){
  const h = new Date().getHours();
  return h>=8 && h<21;
}

function renderHeader(){
  const header = document.getElementById('header');
  if(state.tab==='home'){
    header.innerHTML = `
      <div class="brand-row">
        <div class="brand-mark">
          <div class="glyph">${svg('cup',18)}</div>
          <div class="name">J Nat Coffee<span class="am">ጄ ናት ቡና</span></div>
        </div>
        <button class="icon-btn" onclick="openSearch()">${svg('search',17)}</button>
      </div>
      <div class="page-title">
        <h1>${greeting()}</h1>
        <div class="sub">What would you like today</div>
        <div class="status-pill ${isOpenNow()?'':'closed'}"><span class="dot"></span>${isOpenNow()?'Open now, until 9 PM':'Closed, opens 8 AM'}</div>
      </div>`;
    return;
  }
  if(state.tab==='menu'){
    header.innerHTML = `
      <div class="brand-row">
        <div class="page-title" style="margin-top:0;"><h1 style="font-size:1.4rem;">Menu</h1></div>
        <button class="icon-btn" onclick="openSearch()">${svg('search',17)}</button>
      </div>
      <div class="chip-rail" id="chipRail"></div>`;
  }
}

function renderChips(){
  const rail = document.getElementById('chipRail');
  if(!rail) return;
  rail.innerHTML = CATEGORIES.map(c=>`<button class="chip ${c.id===state.menuCat?'active':''}" onclick="selectCat('${c.id}')">${c.tab}</button>`).join('');
}
function selectCat(id){
  state.menuCat = id;
  renderAll();
  const el = document.querySelector('.chip.active');
  if(el) el.scrollIntoView({inline:'center', behavior:'smooth'});
}

/* ================= Views ================= */

    <div class="welcome-card">
      <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=800&q=80" alt="J Nat Atmosphere" class="jazz-img">

function renderMenu(){
  const cat = CATEGORIES.find(c=>c.id===state.menuCat) || CATEGORIES[0];
  let body = `<p class="blurb">${cat.blurb}</p>`;
  if(cat.items){
    body += cat.items.map(([en,am,price])=>itemRow(ITEMS.find(i=>i.id===cat.id+'_'+en.toLowerCase().replace(/[^a-z0-9]+/g,'_')))).join('');
  } else if(cat.groups){
    cat.groups.forEach(g=>{
      body += `<div class="subhead">${g.h}</div>`;
      body += g.items.map(([en,am,price])=>itemRow(ITEMS.find(i=>i.id===cat.id+'_'+en.toLowerCase().replace(/[^a-z0-9]+/g,'_')))).join('');
    });
  }
  return body;
}

/* ================= Search ================= */
function openSearch(){
  state.searchOpen = true;
  renderSearch();
}
function closeSearch(){
  state.searchOpen = false;
  document.getElementById('searchOverlay').classList.remove('open');
}
function renderSearch(){
  const overlay = document.getElementById('searchOverlay');
  const q = state.query.trim().toLowerCase();
  const results = q.length===0 ? [] : ITEMS.filter(i=> i.en.toLowerCase().includes(q) || i.am.includes(q));
  overlay.innerHTML = `
    <div class="app-header" style="padding-top:calc(14px + env(safe-area-inset-top,0px));">
      <div class="brand-row">
        <button class="icon-btn" onclick="closeSearch()">${svg('arrowLeft',17)}</button>
        <div class="page-title" style="margin-top:0;"><h1 style="font-size:1.2rem;">Search the menu</h1></div>
        <div style="width:36px;"></div>
      </div>
      <div class="search-bar">
        ${svg('search',16)}
        <input id="searchInput" type="text" placeholder="Try shiro, pizza, or macchiato" value="${state.query}" oninput="onSearchInput(this.value)">
      </div>
    </div>
    <div class="view" style="padding-top:4px;">
      ${q.length===0
        ? `<div class="empty-state"><div class="glyph">${svg('search',22)}</div><div class="title">Find anything on the menu</div><div class="sub">Search in English or in Amharic</div></div>`
        : results.length===0
          ? `<div class="empty-state"><div class="glyph">${svg('search',22)}</div><div class="title">Nothing matched</div><div class="sub">Try a different word</div></div>`
          : results.map(itemRow).join('')
      }
    </div>
  `;
  overlay.classList.add('open');
  const input = document.getElementById('searchInput');
  if(input){ input.focus(); const v=input.value; input.value=''; input.value=v; }
}
function onSearchInput(v){
  state.query = v;
  renderSearch();
}

/* ================= Tab bar ================= */
const TABS = [
  {id:'home', label:'Home', ic:'home'},
  {id:'menu', label:'Menu', ic:'grid'}
];
function renderTabbar(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = TABS.map(t=>{
    const active = state.tab===t.id;
    return `<button class="tab-btn ${active?'active':''}" onclick="switchTab('${t.id}')">
      ${svg(t.ic,26)}
      <span>${t.label}</span>
    </button>`;
  }).join('');
}
function switchTab(id){
  state.tab = id;
  renderAll();
}

/* ================= Root render ================= */
function renderAll(){
  renderHeader();
  const screen = document.querySelector('.screen');
  if(state.tab === 'home') screen.classList.add('home-mode');
  else screen.classList.remove('home-mode');

  const view = document.getElementById('view');
  view.classList.remove('enter');
  let html = '';
  if(state.tab==='home') html = renderHome();
  else if(state.tab==='menu') html = renderMenu();
  view.innerHTML = html;
  void view.offsetWidth;
  view.classList.add('enter');
  if(state.tab==='menu') renderChips();
  renderTabbar();
}

/* ================= Init ================= */
renderAll();
